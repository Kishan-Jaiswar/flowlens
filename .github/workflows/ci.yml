name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — a red build from three pushes ago
# is noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # FlowLens is pointed at whatever a developer has on disk, on whatever
        # machine they have — so every supported OS runs the suite. Path
        # handling, case sensitivity and symlink permissions all differ, and
        # none of those differences show up on Linux alone.
        #
        # Vitest 4 cannot start on Node 18 — rolldown imports `styleText` from
        # node:util, which arrived in 20.12. Node 18 compatibility is therefore
        # proven by the `compat` job below, which exercises the product itself
        # rather than the test runner.
        os: [ubuntu-latest]
        node: ['20', '22', '24', '26']
        include:
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # The CLI is the product, so exercise the real commands on every OS
      # rather than trusting unit tests alone. scripts/smoke.mjs is plain Node
      # with no shell, so it is the same test everywhere.
      - name: Every command a user actually types
        run: npm run smoke

  launcher:
    name: launcher from a bare checkout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No `npm ci`, no build: this is the first command a new user runs after
      # copying the project onto a machine, and it has to work by itself.
      - name: ./flowlens with nothing installed
        if: runner.os != 'Windows'
        run: ./flowlens scan examples/clinic

      - name: flowlens.cmd with nothing installed
        if: runner.os == 'Windows'
        shell: cmd
        run: flowlens.cmd scan examples\clinic

  compat:
    name: compat (node 18.18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '18.18'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # package.json declares engines >= 18.18, so that claim is verified by
      # running the CLI itself — which is what a user on Node 18 actually does.
      - name: The CLI works on the oldest supported Node
        run: |
          node --version
          npm run smoke

  quality:
    name: lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check
