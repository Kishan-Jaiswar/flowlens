name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — a red build from three pushes ago
# is noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines; 24 is the current
        # LTS; 26 is what the project is developed on. All three are tested
        # because the CLI is meant to run on whatever a developer already has.
        node: ['18.18', '20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

  quality:
    name: lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # The CLI is the product, so exercise the real commands rather than
      # trusting unit tests alone.
      - name: Scan the example project
        run: node packages/cli/bin/flowlens.mjs scan examples/clinic

      - name: List flows
        run: node packages/cli/bin/flowlens.mjs flows examples/clinic

      - name: Merge a runtime trace
        run: |
          node examples/clinic/demo-trace.mjs
          node packages/cli/bin/flowlens.mjs trace examples/clinic

      - name: Generate a feature document
        run: |
          node packages/cli/bin/flowlens.mjs flow prescriptionform-submit-prescription \
            examples/clinic --markdown --out /tmp/feature.md
          test -s /tmp/feature.md

      - name: Impact analysis
        run: node packages/cli/bin/flowlens.mjs impact AuditService.record -p examples/clinic

      - name: Doctor
        run: node packages/cli/bin/flowlens.mjs doctor examples/clinic

      - name: Dashboard responds
        run: |
          node packages/cli/bin/flowlens.mjs serve examples/clinic --port 4177 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4177/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4177/
          curl -sf http://127.0.0.1:4177/api/flows | head -c 200
