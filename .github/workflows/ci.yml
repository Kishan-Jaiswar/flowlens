name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — a red build from three pushes ago
# is noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Flowslens is pointed at whatever a developer has on disk, on whatever
        # machine they have — so every supported OS runs the suite. Path
        # handling, case sensitivity and symlink permissions all differ, and
        # none of those differences show up on Linux alone.
        #
        # The test runner has a higher floor than the product. Vitest 5
        # declares `^22.12 || ^24 || >=26` and jsdom 30 `^22.22 || ^24.15 ||
        # >=26`, so Node 18 and 20 cannot run the suite at all — and Node 20
        # went end-of-life in April 2026, so the matrix follows rather than
        # pinning the toolchain back.
        #
        # This says nothing about what Flowslens supports. `engines` is still
        # `>=18.18`, and that claim is proven by the `compat` job below, which
        # builds and drives the CLI itself on 18.18 instead of the runner.
        os: [ubuntu-latest]
        node: ['22', '24', '26']
        include:
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # The CLI is the product, so exercise the real commands on every OS
      # rather than trusting unit tests alone. scripts/smoke.mjs is plain Node
      # with no shell, so it is the same test everywhere.
      - name: Every command a user actually types
        run: npm run smoke

  package:
    name: install as a stranger (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Every other job runs against the working tree, where the dashboard and
      # the browser tracer simply exist. `npm pack` cannot reach outside a
      # package directory, so a published CLI once shipped neither and answered
      # `serve` with a 500 while all of CI stayed green. This packs the real
      # tarballs, installs them into a throwaway project, and drives the result
      # over HTTP — the only check that would have caught it.
      - name: Pack, install elsewhere, and serve
        run: npm run test:package

  launcher:
    name: launcher from a bare checkout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No `npm ci`, no build: this is the first command a new user runs after
      # copying the project onto a machine, and it has to work by itself.
      - name: ./flowlens with nothing installed
        if: runner.os != 'Windows'
        run: ./flowlens scan examples/crud

      - name: flowlens.cmd with nothing installed
        if: runner.os == 'Windows'
        shell: cmd
        run: flowlens.cmd scan examples\crud

  compat:
    name: compat (node 18.18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '18.18'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # package.json declares engines >= 18.18, so that claim is verified by
      # running the CLI itself — which is what a user on Node 18 actually does.
      - name: The CLI works on the oldest supported Node
        run: |
          node --version
          npm run smoke

  quality:
    name: lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check
