name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — a red build from three pushes ago
# is noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 4 cannot start on Node 18 — rolldown imports `styleText` from
        # node:util, which arrived in 20.12. Node 18 compatibility is therefore
        # proven by the `compat` job below, which exercises the product itself
        # rather than the test runner.
        node: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

  compat:
    name: compat (node 18.18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '18.18'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # package.json declares engines >= 18.18, so that claim is verified by
      # running the CLI itself — which is what a user on Node 18 actually does.
      - name: The CLI works on the oldest supported Node
        run: |
          node --version
          node packages/cli/bin/flowlens.mjs --version
          node packages/cli/bin/flowlens.mjs scan examples/clinic
          node packages/cli/bin/flowlens.mjs flows examples/clinic
          node packages/cli/bin/flowlens.mjs doctor examples/clinic
          node examples/clinic/demo-trace.mjs
          node packages/cli/bin/flowlens.mjs trace examples/clinic
          node packages/cli/bin/flowlens.mjs impact AuditService.record -p examples/clinic

  quality:
    name: lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # The CLI is the product, so exercise the real commands rather than
      # trusting unit tests alone.
      - name: Scan the example project
        run: node packages/cli/bin/flowlens.mjs scan examples/clinic

      - name: List flows
        run: node packages/cli/bin/flowlens.mjs flows examples/clinic

      - name: Merge a runtime trace
        run: |
          node examples/clinic/demo-trace.mjs
          node packages/cli/bin/flowlens.mjs trace examples/clinic

      - name: Generate a feature document
        run: |
          node packages/cli/bin/flowlens.mjs flow prescriptionform-submit-prescription \
            examples/clinic --markdown --out /tmp/feature.md
          test -s /tmp/feature.md

      - name: Impact analysis
        run: node packages/cli/bin/flowlens.mjs impact AuditService.record -p examples/clinic

      - name: Doctor
        run: node packages/cli/bin/flowlens.mjs doctor examples/clinic

      - name: Dashboard responds
        run: |
          node packages/cli/bin/flowlens.mjs serve examples/clinic --port 4177 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4177/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4177/
          curl -sf http://127.0.0.1:4177/api/flows | head -c 200
